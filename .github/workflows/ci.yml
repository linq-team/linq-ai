name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  mcp-smoke:
    # Runs the real MCP server using the exact command mcp.json ships. This is what
    # catches a bad version pin — the plugin's own files look fine when the server
    # underneath is broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:smoke

  # The one required check. Add every job that must pass to `needs`.
  ci:
    if: always()
    needs: [validate, mcp-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "a required job ended with: $r"; exit 1; }
          done
