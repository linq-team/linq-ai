name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate.mjs
      - run: node --test test/validate.test.mjs

  mcp-smoke:
    # Runs the real MCP server using the exact command mcp.json ships. This is what
    # catches a bad version pin — the plugin's own files look fine when the server
    # underneath is broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test --test-timeout=300000 test/mcp-smoke.test.mjs
